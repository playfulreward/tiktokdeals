<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Continue in Browser</title>
<style>
:root{--bg:#08040d;--text:#fff8ef;--muted:#b8a8c4;--purple:#9b50df;--purple2:#60278f;--orange:#ff7a00;--green:#baff3d;--yellow:#ff922e;--line:rgba(255,181,110,.16);--halloween-gradient:linear-gradient(135deg,#ff7a00 0%,#9b50df 52%,#baff3d 100%);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{width:100%;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:calc(26px + var(--safe-top)) 18px calc(26px + var(--safe-bottom));overflow-x:hidden;background:radial-gradient(circle at 14% 8%,rgba(255,122,0,.25),transparent 31%),radial-gradient(circle at 88% 14%,rgba(155,80,223,.27),transparent 35%),radial-gradient(circle at 50% 100%,rgba(100,39,145,.25),transparent 40%),linear-gradient(160deg,#0d0613,#07030b 72%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.21;background-image:radial-gradient(rgba(255,151,48,.42) .7px,transparent .7px),linear-gradient(34deg,transparent 48.5%,rgba(165,92,210,.06) 49%,rgba(165,92,210,.06) 51%,transparent 51.5%);background-size:15px 15px,58px 58px;-webkit-mask-image:radial-gradient(circle at center,#000 0%,transparent 82%);mask-image:radial-gradient(circle at center,#000 0%,transparent 82%)}
button{font:inherit}
.wrap{position:relative;z-index:2;width:100%;max-width:420px;text-align:center;animation:pageEnter .65s ease both}
@keyframes pageEnter{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.event-heading{margin:0 auto 24px;color:#fff5e9;font-size:clamp(21px,5.5vw,27px);font-weight:950;line-height:1;letter-spacing:-.045em;text-align:center;text-transform:uppercase;text-shadow:0 5px 22px rgba(0,0,0,.34)}
.event-heading span{color:#ff902b;text-shadow:0 0 20px rgba(255,122,0,.2)}
.brand-logo{display:none}
.roblox-brand{display:flex;align-items:center;justify-content:center;gap:13px;margin:2px auto 19px;filter:drop-shadow(0 7px 0 rgba(0,0,0,.25))}
.roblox-brand-mark{position:relative;width:49px;height:49px;border-radius:5px;background:#fff;transform:rotate(12deg)}
.roblox-brand-mark:after{content:"";position:absolute;inset:15px;background:#0b0611}
.roblox-brand-word{color:#fff;font-size:38px;font-weight:950;letter-spacing:-.065em;line-height:1}
.card{position:relative;width:100%;padding:27px 22px 23px;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(31,16,42,.97),rgba(11,6,17,.99));box-shadow:0 28px 78px rgba(0,0,0,.5),0 0 44px rgba(155,80,223,.16)}
.card::before{content:"";position:absolute;top:0;right:0;left:0;height:4px;background:var(--halloween-gradient)}
.status-pill{display:inline-flex;align-items:center;gap:7px;margin-bottom:17px;padding:7px 13px;border:1px solid rgba(186,255,61,.27);border-radius:999px;background:rgba(186,255,61,.07);color:var(--green);font-size:10px;font-weight:850;letter-spacing:1.15px;text-transform:uppercase}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(186,255,61,.1),0 0 13px rgba(186,255,61,.5);animation:statusPulse 1.8s ease-in-out infinite}
@keyframes statusPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.88)}}
h1{margin-bottom:12px;color:#fff;font-size:clamp(30px,8vw,40px);font-weight:900;line-height:1.05;letter-spacing:-.045em;text-transform:uppercase;text-shadow:0 4px 0 rgba(0,0,0,.26)}
.gradient-text{display:inline-block;background:var(--halloween-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{max-width:340px;margin:0 auto 22px;color:var(--muted);font-size:15px;line-height:1.55}
.browser-options{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:18px}
.browser-chip{padding:7px 11px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(255,255,255,.05);color:rgba(245,247,255,.68);font-size:10px;font-weight:750}
.continue-button{position:relative;width:100%;min-height:62px;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden;padding:0 10px;border:2px solid #151526;border-radius:13px;background:linear-gradient(180deg,#fff067,var(--yellow));color:#12131d;cursor:pointer;font-size:clamp(11.5px,3.4vw,14.5px);font-weight:950;letter-spacing:0;line-height:1.1;white-space:nowrap;box-shadow:0 6px 0 #b98700,0 15px 34px rgba(0,0,0,.34);transition:transform .12s ease,filter .2s ease,opacity .2s ease}
.continue-button:hover{filter:brightness(1.06)}
.continue-button:active{transform:translateY(4px);box-shadow:0 2px 0 #b98700,0 9px 23px rgba(0,0,0,.3)}
.continue-button:disabled{cursor:default;opacity:.68;transform:none}
.continue-button::after{content:"";position:absolute;top:0;left:-100%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:buttonShine 2.8s ease-in-out infinite}
.continue-button:disabled::after{display:none}
@keyframes buttonShine{0%,35%{left:-100%}65%,100%{left:160%}}
.button-arrow{font-size:21px;line-height:1}
.loading-dots{display:inline-flex;align-items:center;gap:4px}
.loading-dots span{width:5px;height:5px;border-radius:50%;background:#12131d;animation:dotBounce 1.1s ease-in-out infinite}
.loading-dots span:nth-child(2){animation-delay:.15s}.loading-dots span:nth-child(3){animation-delay:.3s}
@keyframes dotBounce{0%,80%,100%{opacity:.35;transform:scale(.65)}40%{opacity:1;transform:scale(1)}}
.helper{margin-top:15px;color:rgba(169,180,207,.68);font-size:11px;line-height:1.45}
.copy-box{display:none;margin-top:18px;padding:14px;border:1px solid rgba(255,122,0,.27);border-radius:14px;background:rgba(255,122,0,.045);text-align:left}
.copy-box p{margin-bottom:9px;color:var(--muted);font-size:12px;line-height:1.45}
.copy-url{display:block;padding:10px 11px;overflow-wrap:anywhere;border-radius:9px;background:rgba(0,0,0,.3);color:#ffad5b;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:10px;line-height:1.45;user-select:all;-webkit-user-select:all}
.copy-button{width:100%;margin-top:10px;padding:11px;border:1px solid rgba(255,122,0,.36);border-radius:9px;background:transparent;color:#ffad5b;cursor:pointer;font-size:12px;font-weight:800}
.copy-button:active{background:rgba(255,122,0,.08)}
.security-row{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:20px;color:rgba(169,180,207,.52);font-size:10px;font-weight:700}
.security-lock{width:13px;height:13px;display:inline-grid;place-items:center;border:1px solid currentColor;border-radius:3px;font-size:8px}
@media(max-width:420px){body{padding-right:14px;padding-left:14px}.card{padding:25px 17px 21px}h1{font-size:clamp(27px,8.5vw,35px)}.continue-button{padding:0 7px;font-size:11.5px}}
@media(max-height:650px) and (orientation:landscape){body{align-items:flex-start;overflow-y:auto}.wrap{padding-top:8px;padding-bottom:8px}.brand-logo{width:190px;margin-bottom:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="wrap">
  <h2 class="event-heading">Halloween <span>Rewards</span></h2>
  <div class="roblox-brand" aria-label="Roblox"><span class="roblox-brand-mark" aria-hidden="true"></span><span class="roblox-brand-word">ROBLOX</span></div>
  <section class="card">
    <div class="status-pill"><span class="status-dot"></span> Browser required</div>
    <h1>Continue in your <span class="gradient-text">browser</span></h1>
    <p class="subtitle">Safari or Chrome works best. Tap below to keep going.</p>
    <div class="browser-options"><span class="browser-chip">Safari</span> <span class="browser-chip">Chrome</span> <span class="browser-chip">Secure</span></div>
    <button class="continue-button" id="goBtn" type="button">Preparing browser…</button>
    <p class="helper">One tap. We’ll open it in your browser.</p>
    <div class="copy-box" id="copyBox"><p>Automatic opening was blocked. Copy this link and paste it into Safari or Chrome:</p><code class="copy-url" id="copyUrl"></code><button class="copy-button" id="copyBtn" type="button">Copy Link</button></div>
    <div class="security-row"><span class="security-lock">✓</span> Secure browser handoff</div>
  </section>
</main>
<script>
(function(){
  var BASE_DEST="https://tiktokdeals.org/testeruprbx";

  function buildDest(){
    try{
      var currentParams=new URLSearchParams(window.location.search);
      var destUrl=new URL(BASE_DEST);

      ["sub1","sub2","sub3","sub4","sub5"].forEach(function(param){
        var value=currentParams.get(param);
        if(value!==null){
          destUrl.searchParams.set(param,value);
        }
      });

      return destUrl.toString();
    }catch(e){
      return BASE_DEST;
    }
  }

  var DEST=buildDest(),
      ua=navigator.userAgent||"",
      isAndroid=/Android/i.test(ua),
      isIOS=/iphone|ipad|ipod/i.test(ua),
      btn=document.getElementById("goBtn"),
      copyBox=document.getElementById("copyBox"),
      copyUrl=document.getElementById("copyUrl"),
      copyBtn=document.getElementById("copyBtn"),
      attempted=false,
      hidden=false;

  document.addEventListener("visibilitychange",function(){
    if(document.hidden)hidden=true;
  });

  setTimeout(function(){
    if(!attempted)
      btn.innerHTML='Continue to Roblox Halloween Rewards <span class="button-arrow">→</span>';
  },850);

  function intent(d){
    try{
      var u=new URL(d);
      return "intent://"+u.hostname+u.pathname+u.search+u.hash+
        "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url="+
        encodeURIComponent(d)+";end;";
    }catch(e){
      return null;
    }
  }

  function opening(){
    btn.disabled=true;
    btn.innerHTML='Opening browser<span class="loading-dots"><span></span><span></span><span></span></span>';
  }

  function fallback(){
    copyUrl.textContent=DEST;
    copyBox.style.display="block";
    btn.textContent="Copy the link below";
    btn.disabled=true;
  }

  function newTab(){
    try{
      var w=window.open(DEST,"_blank","noopener,noreferrer");
      return Boolean(w);
    }catch(e){
      return false;
    }
  }

  function go(){
    if(attempted)return;

    attempted=true;
    hidden=false;
    opening();

    if(isAndroid){
      var i=intent(DEST);

      if(!i){
        window.location.href=DEST;
        return;
      }

      window.location.href=i;

      setTimeout(function(){
        if(!document.hidden&&!hidden){
          var o=newTab();
          if(!o)window.location.href=DEST;
        }
      },2200);

      setTimeout(function(){
        if(!document.hidden&&!hidden)fallback();
      },4200);

      return;
    }

    if(isIOS){
      try{
        window.location.href="x-safari-"+DEST;
      }catch(e){}

      setTimeout(function(){
        if(!document.hidden&&!hidden){
          var o=newTab();
          if(!o)window.location.href=DEST;
        }
      },1700);

      setTimeout(function(){
        if(!document.hidden&&!hidden)fallback();
      },3600);

      return;
    }

    window.location.href=DEST;
  }

  function fbCopy(){
    var t=document.createElement("textarea");
    t.value=DEST;
    t.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
    document.body.appendChild(t);
    t.focus();
    t.select();

    try{
      document.execCommand("copy");
      copyBtn.textContent="Copied!";

      setTimeout(function(){
        copyBtn.textContent="Copy Link";
      },2000);
    }catch(e){
      copyBtn.textContent="Select the link above";
    }

    document.body.removeChild(t);
  }

  btn.addEventListener("click",function(e){
    e.preventDefault();
    go();
  });

  copyBtn.addEventListener("click",function(){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(DEST).then(function(){
        copyBtn.textContent="Copied!";

        setTimeout(function(){
          copyBtn.textContent="Copy Link";
        },2000);
      },fbCopy);

      return;
    }

    fbCopy();
  });
})();
</script>

</body>
