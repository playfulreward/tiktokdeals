<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Continue</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{
      background:#000;
      background-image:radial-gradient(ellipse at 50% 38%,rgba(13,242,166,.12) 0%,rgba(0,0,0,0) 55%);
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      padding:24px;overflow:hidden
    }
    .wrap{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;text-align:center}
    .icon{
      width:96px;height:96px;border-radius:22px;
      background:linear-gradient(180deg,#0a1814 0%,#050e0a 100%);
      border:1px solid rgba(13,242,166,.20);
      box-shadow:0 0 0 1px rgba(255,255,255,.02) inset,0 18px 50px rgba(13,242,166,.12);
      display:flex;align-items:center;justify-content:center;margin-bottom:36px
    }
    .icon svg{width:44px;height:44px;display:block}
    h1{font-size:38px;line-height:1.15;font-weight:700;letter-spacing:-.5px;margin-bottom:18px}
    h1 .accent{color:#0df2a6;font-weight:700}
    p.sub{font-size:17px;line-height:1.5;color:#8a8f8c;max-width:360px;margin:0 auto 48px;font-weight:400}
    button.btn{
      width:100%;max-width:420px;padding:22px 24px;
      background:#0df2a6;color:#131a22;
      font-size:17px;font-weight:800;letter-spacing:3px;
      border:none;border-radius:999px;cursor:pointer;
      box-shadow:0 0 50px rgba(13,242,166,.45),0 0 110px rgba(13,242,166,.25);
      transition:transform .08s ease,opacity .15s ease;font-family:inherit
    }
    button.btn:active{transform:scale(.985);opacity:.95}
    .meta{margin-top:28px;color:#555a57;font-size:14px;letter-spacing:.2px}
    .meta span{white-space:nowrap}
    .meta .dot{margin:0 10px;opacity:.7}
    @media(max-width:360px){
      h1{font-size:32px}p.sub{font-size:15px}
      .icon{width:84px;height:84px;border-radius:19px}.icon svg{width:38px;height:38px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 17L17 7" stroke="#0df2a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M7 7H17V17" stroke="#0df2a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Open in <span class="accent">browser</span></h1>
    <p class="sub">For the best experience, this page needs to open in your browser.</p>
    <button id="continueBtn" class="btn">CONTINUE</button>
    <div class="meta">
      <span>Safari</span><span class="dot">·</span><span>Chrome</span><span class="dot">·</span><span>Secure</span>
    </div>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const baseUrl = 'https://tiktokdeals.org/gravy1anew';
      const forwardParams = new URLSearchParams();
      ['sub1', 'sub2', 'sub3', 'sub4', 'sub5'].forEach(function(key) {
        if (params.has(key)) {
          forwardParams.append(key, params.get(key));
        }
      });
      const queryString = forwardParams.toString();
      const fullUrl = queryString ? baseUrl + '?' + queryString : baseUrl;

      const isAndroid = /android/i.test(navigator.userAgent);
      let finalUrl;
      if (isAndroid) {
        finalUrl = 'intent://' + fullUrl.replace(/^https?:\/\//, '') + '#Intent;scheme=https;end';
      } else {
        finalUrl = 'x-safari-' + fullUrl;
      }

      const btn = document.getElementById('continueBtn');
      btn.addEventListener('click', function() {
        window.location.href = finalUrl;
      });
    })();
  </script>
</body>
</html>
