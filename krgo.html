<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Redirect</title>
<script>
(function () {
// Grab the full user agent
var ua = (navigator.userAgent || navigator.vendor || window.opera || "").toLowerCase();

// Basic mobile check (phones + tablets)
var isMobile = /android|iphone|ipad|ipod|blackberry|iemobile|wpdesktop|windows phone/.test(ua);

// TikTok / ByteDance in-app browser indicators seen in real UAs:
// - "tiktok"
// - "musical_ly"
// - "aweme_" (TikTok internal app name)
// - "bytedancewebview"
// - "bytelocale/"
// - sometimes "trill" on older builds
var isTikTokInApp = /tiktok|musical\.ly|aweme_|bytedancewebview|bytelocale|trill/.test(ua);

if (isMobile && isTikTokInApp) {
// TikTok in-app browser on mobile → Playful Rewards
window.location.replace("https://montrk.co.uk/?a=26157&c=54502&s1=gatekeep4pmmarch22");
}
})();
</script>
</head>
<body>
</body>
</html>
